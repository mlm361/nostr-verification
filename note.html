<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Note Viewer - Mitchell Tribe</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 700px;
            margin: 50px auto;
            padding: 20px;
            line-height: 1.6;
            background: #fff;
        }
        .note {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            background: #f9f9f9;
        }
        .loading { color: #666; }
        .error { color: #c00; }
        .content { white-space: pre-wrap; margin: 20px 0; }
        img { max-width: 100%; height: auto; margin: 10px 0; border-radius: 4px; }
        .meta { color: #666; font-size: 0.9em; border-top: 1px solid #ddd; padding-top: 15px; margin-top: 15px; }
        a { color: #0066cc; }
    </style>
</head>
<body>
    <div class="note" id="note">
        <p class="loading">Loading note...</p>
    </div>

    <script type="module">
        const noteId = window.location.hash.substring(1);
        
        if (!noteId) {
            document.getElementById('note').innerHTML = '<p class="error">No note ID in URL</p>';
        } else {
            loadNote(noteId);
        }
        
        async function loadNote(noteId) {
            const relays = [
                'wss://relay.mitchelltribe.com',
                'wss://nos.lol',
                'wss://relay.damus.io'
            ];
            
            let noteFound = false;
            
            for (const relay of relays) {
                if (noteFound) break;
                
                try {
                    await new Promise((resolve, reject) => {
                        const ws = new WebSocket(relay);
                        const timeout = setTimeout(() => {
                            ws.close();
                            reject(new Error('Timeout'));
                        }, 5000);
                        
                        ws.onopen = () => {
                            ws.send(JSON.stringify(['REQ', 'note', { ids: [noteId] }]));
                        };
                        
                        ws.onmessage = (event) => {
                            const data = JSON.parse(event.data);
                            if (data[0] === 'EVENT') {
                                clearTimeout(timeout);
                                displayNote(data[2]);
                                noteFound = true;
                                ws.close();
                                resolve();
                            }
                        };
                        
                        ws.onerror = () => {
                            clearTimeout(timeout);
                            reject(new Error('Connection error'));
                        };
                    });
                } catch (e) {
                    console.log(`Failed to connect to ${relay}:`, e.message);
                }
            }
            
            if (!noteFound) {
                document.getElementById('note').innerHTML = 
                    `<p class="error">Could not load note.<br><a href="https://njump.me/${noteId}">View on njump.me</a></p>`;
            }
        }
        
        function displayNote(note) {
            const content = note.content;
            const date = new Date(note.created_at * 1000).toLocaleString();
            
            const imagePattern = /(https?:\/\/\S+\.(?:jpg|jpeg|png|gif|webp)(?:\?\S*)?)/gi;
            const images = content.match(imagePattern) || [];
            const text = content.replace(imagePattern, '').trim();
            
            let html = '';
            
            if (text) {
                html += '<div class="content">' + escapeHtml(text) + '</div>';
            }
            
            if (images.length > 0) {
                images.forEach(url => {
                    html += `<img src="${escapeHtml(url)}" alt="Image" loading="lazy" />`;
                });
            }
            
            html += `<div class="meta">Posted: ${date}<br>`;
            html += `<a href="https://njump.me/${note.id}">View on other clients</a></div>`;
            
            document.getElementById('note').innerHTML = html;
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
